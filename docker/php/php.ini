; Application-level PHP settings (dev-oriented defaults).
memory_limit = 512M

; Dates come from the DB and are stored as UTC; keep the runtime aligned.
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
; Bind mounts make timestamp checks cheap enough to keep validation on in dev.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
