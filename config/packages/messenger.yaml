framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # async: '%env(MESSENGER_TRANSPORT_DSN)%'
            # failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Notifications are delivered in-process for now, so a saved product is
            # logged and mailed before the response returns and no worker is needed
            # to run the stack.
            #
            # Moving delivery off the request is a one-line change: uncomment the
            # `async` transport above and point this at it instead. That is why the
            # message carries a flat, serialisable snapshot rather than the entity.
            'App\Message\ProductSavedNotification': sync

